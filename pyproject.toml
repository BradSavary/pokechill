[project]
name = "pokechill"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<6",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytailwindcss>=0.4.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

# --- Ruff: linter + formatter (replaces flake8, isort and black) ---
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import sorting, B: common bugs,
# UP: modern Python syntax, DJ: Django-specific rules, SIM: simplifications
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated by Django: no need to lint them
"*/migrations/*" = ["E501"]

# --- pytest ---
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

# --- Vercel deployment ---
# Vercel detects Django from manage.py and runs collectstatic by itself.
# This build step applies pending migrations to the production database.
[tool.vercel.scripts]
build = "python manage.py migrate --noinput"
