{# Every remaining arrival at once; cards pop one after the other (animation-delay) #}
<h2 class="text-xl font-bold">Your new arrivals</h2>
<div class="flex flex-wrap justify-center gap-3">
  {% for reveal in reveals %}
    <div class="reveal-pop-fast" style="animation-delay: {% widthratio forloop.counter0 1 150 %}ms">
      {% include "ranch/_reveal_card.html" with size="small" %}
    </div>
  {% endfor %}
</div>
<button type="button" data-close-dialog class="rounded-lg bg-accent px-4 py-2 font-bold text-night">Done</button>
